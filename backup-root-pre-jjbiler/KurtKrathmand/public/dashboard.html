<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Krathman</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        background: linear-gradient(135deg, #0f172a, #111827 60%, #0b1220);
        color: #f4f7fb;
      }
      .admin-shell {
        max-width: 1100px;
        width: min(94vw, 1100px);
        margin: 80px auto;
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 24px;
        box-shadow: 0 20px 44px rgba(0, 0, 0, 0.2);
        padding: 32px;
      }
      .admin-shell h1 { margin: 0 0 12px; font-size: clamp(2rem, 3vw, 3rem); }
      .admin-shell p { margin: 0 0 18px; color: #c7d2fe; }
      .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
      .config-section { background: rgba(255,255,255,0.03); border: 1px solid rgba(148, 163, 184, 0.22); border-radius: 18px; padding: 18px; }
      .config-section h2 { margin: 0 0 12px; font-size: 1.2rem; }
      .admin-form { display: grid; gap: 18px; }
      .field { display: grid; gap: 8px; margin-bottom: 14px; }
      label { font-weight: 700; }
      input, textarea, button, a { font: inherit; }
      input, textarea { background: rgba(255,255,255,0.04); border: 1px solid rgba(148, 163, 184, 0.22); color: #f4f7fb; border-radius: 12px; padding: 12px 14px; width: 100%; }
      textarea { min-height: 90px; resize: vertical; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
      .primary-btn, .secondary-btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 12px 18px; font-weight: 700; text-decoration: none; }
      .primary-btn { cursor: pointer; border: none; background: #3b82f6; color: white; }
      .secondary-btn { border: 1px solid rgba(148, 163, 184, 0.22); background: transparent; color: #f4f7fb; }
      .admin-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }
      .admin-nav a {
        color: #fff;
        text-decoration: none;
      }
      .danger-box {
        background: rgba(239,68,68,0.08);
        border: 1px solid rgba(239,68,68,0.3);
        border-radius: 14px;
        padding: 16px;
      }
      .danger-box button {
        background: #ef4444;
        color: white;
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <div class="admin-nav">
        <a href="/">← Forside</a>
        <a href="/logout">Log ud</a>
      </div>
      <div id="adminContent"></div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
