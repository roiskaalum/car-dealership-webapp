<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biler – Krathman</title>
    <meta name="description" content="Bilsøgning og brugte biler." />
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
  </head>
  <body data-page="biler">
    <div id="site-header"></div>

    <main>
      <section class="search-page hero compact-hero">
        <div class="hero-image"></div>
        <div class="hero-overlay"></div>
        <div class="container hero-inner single-column">
          <div class="hero-copy">
            <p class="eyebrow">Biler</p>
            <h1 data-config="bannerTitle">Kvalitetsbiler til Alle</h1>
            <p data-config="bannerText">Udforsk udvalget af biler tilgængelige på BilInfo.</p>
          </div>
        </div>
      </section>

      <section class="inventory inventory-page">
        <div class="container">
          <div class="search-panel wide-panel">
            <div class="panel-head">
              <strong>Søg i biler</strong>
              <span id="inventoryCount">0 biler fundet</span>
            </div>

            <div class="field-grid">
              <label>
                <span>Søg</span>
                <input type="text" id="searchInput" placeholder="Søg mærke, model, brændstof..." />
              </label>

              <label>
                <span>Mærke</span>
                <select id="brandSelect">
                  <option value="all">Alle mærker</option>
                </select>
              </label>

              <label>
                <span>Model</span>
                <select id="modelSelect">
                  <option value="all">Alle modeller</option>
                </select>
              </label>

              <label>
                <span>Pris</span>
                <select id="priceSelect">
                  <option value="all">Alle priser</option>
                  <option value="0-100000">Under 100.000 kr.</option>
                  <option value="100000-200000">100.000 - 200.000 kr.</option>
                  <option value="200000-300000">200.000 - 300.000 kr.</option>
                  <option value="300000-999999">Over 300.000 kr.</option>
                </select>
              </label>
            </div>

            <div class="filter-groups">
              <div class="filter-group" data-filter-group="fuel">
                <p>Brændstof</p>
                <div class="filter-options">
                  <label><input type="checkbox" value="electric" /> El</label>
                  <label><input type="checkbox" value="diesel" /> Diesel</label>
                  <label><input type="checkbox" value="benzin" /> Benzin</label>
                  <label><input type="checkbox" value="hybrid" /> Hybrid</label>
                </div>
              </div>

              <div class="filter-group" data-filter-group="body">
                <p>Biltype</p>
                <div class="filter-options">
                  <label><input type="checkbox" value="suv" /> SUV</label>
                  <label><input type="checkbox" value="hatchback" /> Lille bil</label>
                  <label><input type="checkbox" value="sedan" /> Sedan</label>
                  <label><input type="checkbox" value="kombi" /> Kombi</label>
                  <label><input type="checkbox" value="van" /> Varevogn</label>
                </div>
              </div>

              <div class="filter-group" data-filter-group="transmission">
                <p>Gearkasse</p>
                <div class="filter-options">
                  <label><input type="checkbox" value="aut" /> Automatgear</label>
                  <label><input type="checkbox" value="man" /> Manuel</label>
                </div>
              </div>

              <div class="filter-group" data-filter-group="doors">
                <p>Døre</p>
                <div class="filter-options">
                  <label><input type="checkbox" value="door-2" /> 2-dørs</label>
                  <label><input type="checkbox" value="door-4" /> 4-dørs</label>
                  <label><input type="checkbox" value="door-5" /> 5-dørs</label>
                </div>
              </div>
            </div>
          </div>

          <div class="toolbar">
            <div class="toolbar-left">
              <label>
                <span>Sorter efter</span>
                <select id="sortSelect">
                  <option value="newest">Nyeste først</option>
                  <option value="price-low">Pris lav til høj</option>
                  <option value="price-high">Pris høj til lav</option>
                  <option value="year-new">År: nyt til gammelt</option>
                  <option value="year-old">År: gammelt til nyt</option>
                </select>
              </label>
            </div>
            <div class="toolbar-right">
              <p id="filterSummary">Viser alle biler</p>
            </div>
          </div>

          <div class="car-grid" id="carGrid"></div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="script.js"></script>
  </body>
</html>
