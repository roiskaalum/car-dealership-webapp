<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin – Krathman</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #f4f7fb;
        --muted: #c7d2fe;
        --accent: #3b82f6;
        --border: rgba(148, 163, 184, 0.22);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #111827 60%, #0b1220); color: var(--text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .admin-shell {
        max-width: 1100px; width: min(94vw, 1100px); margin: 80px auto; background: rgba(17, 24, 39, 0.9); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 20px 44px rgba(0,0,0,0.2); padding: 32px;
      }
      .admin-shell h1 { margin: 0 0 12px; font-size: clamp(2rem, 3vw, 3rem); }
      .admin-shell p { margin: 0 0 18px; color: var(--muted); }
      .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
      .config-section { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 18px; padding: 18px; }
      .config-section h2 { margin: 0 0 12px; font-size: 1.2rem; }
      .admin-form { display: grid; gap: 18px; }
      .field { display: grid; gap: 8px; margin-bottom: 14px; }
      .field-note { font-size: 0.8rem; color: rgba(199, 210, 254, 0.8); }
      label { font-weight: 700; }
      input, textarea, button, a { font: inherit; }
      input, textarea { background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px 14px; width: 100%; }
      textarea { min-height: 90px; resize: vertical; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
      .primary-btn, .secondary-btn {
        display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 12px 18px; font-weight: 700; text-decoration: none;
      }
      .primary-btn { cursor: pointer; border: none; background: var(--accent); color: white; }
      .secondary-btn { border: 1px solid var(--border); background: transparent; color: var(--text); }
      .admin-lock { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
      .readability-preview { display: grid; gap: 6px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--border); background: rgba(59,130,246,0.06); color: var(--text); }
      .readability-preview strong { color: #fff; }
      .topbar {
        background: rgba(17, 24, 39, 0.9);
        border-bottom: 1px solid var(--border);
        padding: 0 20px;
      }
      .topbar .container {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        min-height: 82px;
      }
      .topbar a {
        color: #fff;
        text-decoration: none;
      }
      .topbar .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .topbar .brand img {
        width: 42px;
        height: 42px;
        object-fit: cover;
        border-radius: 10px;
      }
      .topbar .main-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        flex-wrap: wrap;
      }
      .topbar .nav-home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.3rem;
        height: 1.3rem;
      }
      .topbar svg {
        width: 1.3rem;
        height: 1.3rem;
        display: block;
      }
    </style>
    <script src="config.js"></script>
  </head>
  <body>
    <div class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="index.html" aria-label="Krathman">
          <img src="images/logo.jpg" alt="Krathman logo" />
          <span>KRATHMAN</span>
        </a>

        <nav class="main-nav" aria-label="Hovednavigation">
          <a class="nav-home" href="index.html" aria-label="Til forsiden">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 10.5 12 3l9 7.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
              <path d="M5.5 9.5V20h13V9.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
              <path d="M10 20v-6h4v6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
            </svg>
          </a>
          <a href="index.html">Forside</a>
          <a href="biler.html">Biler</a>
          <a href="om-os-kontakt.html">Om Os &amp; Kontakt</a>
        </nav>
      </div>
    </div>

    <div class="admin-shell" id="adminContent"></div>
    <script src="script.js"></script>
  </body>
</html>
