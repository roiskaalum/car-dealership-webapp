<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login – Krathmand</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        background: linear-gradient(135deg, #0f172a, #111827 60%, #0b1220);
        color: #f4f7fb;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .login-box {
        width: min(92vw, 480px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 22px;
        padding: 28px;
        box-shadow: 0 20px 44px rgba(0,0,0,0.2);
      }
      .login-box h1 { margin: 0 0 12px; }
      .login-box p { margin: 0 0 20px; color: #c7d2fe; }
      .login-box label { display: block; margin-bottom: 6px; font-weight: 700; }
      .login-box input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: rgba(255,255,255,0.04);
        color: #f4f7fb;
        margin-bottom: 16px;
      }
      .login-box button {
        width: 100%;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
      }
      .status {
        margin-top: 14px;
        color: #bfdbfe;
        min-height: 22px;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h1>Admin login</h1>
      <p>Dette er kun til intern brug. Kontakt os for redigering.</p>
      <form id="adminLoginForm">
        <label for="username">Brugernavn</label>
        <input id="username" type="text" name="username" autocomplete="username" />

        <label for="password">Adgangskode</label>
        <input id="password" type="password" name="password" autocomplete="current-password" />

        <button type="submit">Log ind</button>
      </form>
      <div class="status" id="loginStatus"></div>
      <a href="/index.html" class="secondary" style="display:inline-block; margin-top:14px; color:#dbeafe; text-decoration:none;">← Tilbage til hjemmesiden</a>
    </div>

    <script>
      const form = document.getElementById('adminLoginForm');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const status = document.getElementById('loginStatus');
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (username === 'admin' && password === 'admin123') {
          localStorage.setItem('staticAdminSession', 'active');
          window.location.href = '/dashboard.html';
          return;
        }

        status.textContent = 'Forkert brugernavn eller adgangskode.';
      });
    </script>
  </body>
</html>
